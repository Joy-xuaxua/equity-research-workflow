name: Validate skill

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate JSON and Python syntax
        run: |
          python -m json.tool references/industry-rules.json >/dev/null
          python -m py_compile scripts/dcf.py scripts/check_research_output.py scripts/valuation_inputs.py scripts/derive_metrics.py

      - name: Run unit tests
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests -v

      - name: Run script demos
        env:
          PYTHONUTF8: "1"
        run: |
          python scripts/dcf.py --demo
          python scripts/dcf.py --demo3
          python scripts/check_research_output.py --demo
